name: Release APK

# Run by hand from the Actions tab. Needs these repository secrets (nothing is stored in the repo):
#   RELEASE_KEYSTORE_BASE64  the keystore file, base64-encoded (`base64 -i release.jks | pbcopy`)
#   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL the app should talk to (must be https unless it is a local address)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + integration tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Restore the keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build the signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PapiBaseUrl="${{ inputs.api_base_url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: paper-todo-release
          path: app/build/outputs/apk/release/*.apk
